
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Course | DocTrack</title>
    <link rel="stylesheet" href="{% static 'documents/css/style.css' %}">
</head>
<body>
    <main class="course-page">
        <h1>Delete Course</h1>

        <p>
            Are you sure you want to delete this course?
        </p>

        <p>
            <strong>Course Code:</strong> {{ course.course_code }}
        </p>

        <p>
            <strong>Course Name:</strong> {{ course.course_name }}
        </p>

        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn">
                Confirm Delete
            </button>

            <a href="{% url 'course' %}" class="btn">
                Cancel
            </a>
        </form>
    </main>
</body>
</html>
